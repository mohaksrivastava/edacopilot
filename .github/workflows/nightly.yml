name: Nightly

on:
  schedule:
    # 06:00 UTC daily. These are coverage-simulation tests (hundreds of
    # bootstrap trials, deterministic fixed seeds) -- not needed on every
    # push/PR, but should still run regularly so a regression doesn't sit
    # undetected between releases.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install edacopilot (dev + all extras)
        run: python -m pip install -e ".[dev,all]"

      - name: pytest (slow)
        run: pytest -m "slow"
