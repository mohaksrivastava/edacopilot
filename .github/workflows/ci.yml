name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install edacopilot (dev + all extras)
        run: python -m pip install -e ".[dev,all]"

      # Rule 8: Apache-2.0 project, no GPL-family dependencies. "GPL" as a
      # partial match also catches LGPL and AGPL license names.
      - name: License check (no GPL/LGPL/AGPL dependencies)
        run: |
          python -m pip install pip-licenses
          pip-licenses --partial-match --fail-on="GPL"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src/

      - name: pytest
        run: pytest -m "not llm and not slow"

      # Coverage-simulation tests (hundreds of bootstrap trials) run on one
      # leg only -- they're deterministic (fixed seeds), so running them on
      # every OS/Python combination would just multiply wall-clock time
      # without checking anything new.
      - name: pytest (slow)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest -m "slow"

      # Exercises notebook export (Section 14, milestone M14): every accepted
      # step must round-trip through nbclient and reproduce its numbers. This
      # is a no-op until the export tests land.
      - name: Export round-trip test
        if: hashFiles('tests/**/test_export*.py') != ''
        run: pytest tests/ -k export

  test-min-versions:
    # Section 4.1's dependency floors (pandas>=2.2, scipy>=1.13,
    # statsmodels>=0.14) are a promise, not just a default from always
    # installing latest. This leg installs exactly those floors, plus the
    # numpy version they themselves require, at our lowest supported
    # Python, and proves the test suite still passes against them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install edacopilot with pinned minimum dependency versions
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "numpy==1.26.0" "pandas==2.2.0" "scipy==1.13.0" "statsmodels==0.14.0"

      - name: pytest
        run: pytest -m "not llm and not slow"
