[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edacopilot"
version = "0.1.0"
description = "A Jupyter-based EDA co-pilot for junior data scientists."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "edacopilot maintainers" }]
dependencies = [
  "pandas>=2.2",
  # numpy is used directly (edacore.profiling), not just transitively. 1.26.0
  # is pandas 2.2.0's own floor for Python >=3.12, the binding constraint
  # across our supported Python range (also above scipy 1.15.0's 1.23.5 floor).
  "numpy>=1.26.0",
  "scipy>=1.15",
  "statsmodels>=0.14",
  "scikit-learn",
  "scikit-posthocs",
  "pydantic>=2",
  # Section 8.1's persona policies are YAML files. PyYAML was already
  # present transitively (via litellm); declaring it makes the dependency
  # real rather than a happy accident, and the min-versions CI leg pins it.
  "pyyaml>=6",
  "litellm",
  "matplotlib",
  "ipywidgets>=8",
  "ipython",
  "nbformat",
  "pyarrow",
]

[project.optional-dependencies]
timeseries = ["ruptures"]
text = ["langdetect"]
plotly = ["plotly"]
all = ["edacopilot[timeseries,text,plotly]"]
dev = [
  "pytest",
  "hypothesis",
  # Section 13 targets VS Code notebooks as well as JupyterLab, and VS Code
  # can only select a virtualenv as a kernel if ipykernel is installed in
  # it. Not a hard dependency: the library never imports it, and a user's
  # own Jupyter install already provides one.
  "ipykernel",
  "ruff",
  "mypy",
  "pandas-stubs",
  "types-PyYAML",
  "pre-commit",
  "nbclient",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edacore", "src/edacopilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ARCHITECTURE.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Higher than requires-python: numpy's bundled stubs use PEP 695 `type`
# statements that mypy can only parse when targeting 3.12+, the minimum
# that supports it. Our own code still has to run on 3.11, so it must not
# rely on syntax mypy would only accept because of this setting.
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# scipy/statsmodels/sklearn/scikit-posthocs ship no py.typed marker /
# stubs (unlike pandas, covered by pandas-stubs above); every call into
# them is effectively Any. Scoped to just these, not a blanket ignore.
# ipywidgets ships no py.typed marker either (Section 13's UI layer).
module = [
  "scipy.*",
  "statsmodels.*",
  "sklearn.*",
  "scikit_posthocs.*",
  "ipywidgets.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "llm: requires a live or mocked LLM call (excluded from the default CI run)",
  "slow: runs a coverage simulation (hundreds of trials); still runs in CI, pass -m 'not slow' to skip locally",
]
filterwarnings = [
  # edacore.contracts.TestResult is a pydantic model (Section 5.3), not a
  # pytest test class; its name just collides with pytest's collection
  # pattern for the module it happens to be imported into.
  "ignore:cannot collect test class 'TestResult':pytest.PytestCollectionWarning",
]
