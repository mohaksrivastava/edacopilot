[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edacopilot"
version = "0.1.0"
description = "A Jupyter-based EDA co-pilot for junior data scientists."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "edacopilot maintainers" }]
dependencies = [
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn",
  "scikit-posthocs",
  "pydantic>=2",
  "litellm",
  "matplotlib",
  "ipywidgets>=8",
  "ipython",
  "nbformat",
  "pyarrow",
]

[project.optional-dependencies]
timeseries = ["ruptures"]
text = ["langdetect"]
plotly = ["plotly"]
all = ["edacopilot[timeseries,text,plotly]"]
dev = [
  "pytest",
  "hypothesis",
  "ruff",
  "mypy",
  "pandas-stubs",
  "pre-commit",
  "nbclient",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edacore", "src/edacopilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ARCHITECTURE.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Higher than requires-python: numpy's bundled stubs use PEP 695 `type`
# statements that mypy can only parse when targeting 3.12+. Our own code
# still has to run on 3.11, so it must not rely on syntax mypy would only
# accept because of this setting.
python_version = "3.13"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "llm: requires a live or mocked LLM call (excluded from the default CI run)",
]
filterwarnings = [
  # edacore.contracts.TestResult is a pydantic model (Section 5.3), not a
  # pytest test class; its name just collides with pytest's collection
  # pattern for the module it happens to be imported into.
  "ignore:cannot collect test class 'TestResult':pytest.PytestCollectionWarning",
]
